services:
  api:
    image: shuhrat/mra-assets-server:latest
    container_name: assets-api
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_HTTP_PORT=8002
      - MongoDb__ConnectionString=mongodb://host.docker.internal:27017
      - MongoDb__DatabaseName=mra-assets
      - MongoDb__Seeder=true
      - MongoDb__Version=1
    ports:
      - "8002:80"
    depends_on:
      - seq
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  mongo-express:
    image: mongo-express
    container_name: assets-db-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: 
      ME_CONFIG_MONGODB_ADMINPASSWORD: 
      ME_CONFIG_MONGODB_URL: mongodb://host.docker.internal:27017/
      ME_CONFIG_BASICAUTH: false
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  seq:
    image: datalust/seq:latest
    container_name: assets-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341"
      - "8000:80"
    volumes:
      - seq_data:/data
    restart: unless-stopped

volumes:
  seq_data: